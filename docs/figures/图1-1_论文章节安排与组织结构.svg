   <g id="text_2">
    <text style="font-size: 8.8px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(289.57296 24.262231)">绪  论</text>
    <text style="font-size: 8.8px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(153.17296 35.379106)">课题背景与研究意义  |  国内外研究现状综述  |  主要研究内容与章节组织</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.1px; font-family: 'SimSun', serif; fill: #1f4e79" transform="translate(36.696832 92.511032)">系统建模</text>
    <text style="font-weight: 700; font-size: 9.1px; font-family: 'SimSun', serif; fill: #1f4e79" transform="translate(36.696832 103.20922)">基础研究</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'SimSun', serif; fill: #ffffff" transform="translate(112.167776 89.140501)">第</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'SimSun', serif; fill: #ffffff" transform="translate(112.167776 97.257423)">二</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'SimSun', serif; fill: #ffffff" transform="translate(112.167776 106.178579)">章</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.7px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(152.15832 92.607126)">无人机集群空地协同</text>
    <text style="font-weight: 700; font-size: 8.7px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(152.15832 102.879923)">计算系统建模与分析</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.3px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(275.702976 87.919872)">• 自然覆盖几何关联、离散机动与无线信道建模</text>
    <text style="font-size: 8.3px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(275.702976 97.588075)">• 协议 I（批量等份共享）与协议 II（跨时隙排队）</text>
    <text style="font-size: 8.3px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(275.702976 107.298427)">• 截止期满足率双因子分解与同源配对评价准则</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.1px; font-family: 'SimSun', serif; fill: #1f4e79" transform="translate(36.696832 236.664438)">协同规划</text>
    <text style="font-weight: 700; font-size: 9.1px; font-family: 'SimSun', serif; fill: #1f4e79" transform="translate(41.246832 247.697477)">与控制</text>
    <text style="font-weight: 700; font-size: 9.1px; font-family: 'SimSun', serif; fill: #1f4e79" transform="translate(36.696832 258.87768)">技术研究</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'SimSun', serif; fill: #ffffff" transform="translate(112.167776 174.373237)">第</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'SimSun', serif; fill: #ffffff" transform="translate(112.167776 182.490159)">三</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'SimSun', serif; fill: #ffffff" transform="translate(112.167776 191.411315)">章</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.7px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(152.15832 177.884721)">无人机集群需求感知</text>
    <text style="font-weight: 700; font-size: 8.7px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(165.20832 188.067799)">协同轨迹规划</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.3px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(275.702976 173.120186)">• 原始已关联观测下未覆盖需求混叠瓶颈诊断</text>
    <text style="font-size: 8.3px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(275.702976 182.788389)">• 感知半径内未覆盖终端按距离排序扩展观测</text>
    <text style="font-size: 8.3px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(275.702976 192.498741)">• 上层关系自注意力轨迹与下层无注意力精简卸载</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'SimSun', serif; fill: #ffffff" transform="translate(112.167776 238.914645)">第</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'SimSun', serif; fill: #ffffff" transform="translate(112.167776 247.376239)">四</text>
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'SimSun', serif; fill: #ffffff" transform="translate(112.167776 256.297395)">章</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 8.7px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(143.45832 242.553606)">跨机资源竞争下的无人机</text>
    <text style="font-weight: 700; font-size: 8.7px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(156.50832 252.826403)">集群计算任务分配</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.3px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(275.702976 237.845278)">• 单时隙批量等份共享下的跨机迁移时延外部性</text>
    <text style="font-size: 8.3px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(275.702976 247.513481)">• 超时请求数优先与归一化时延次之二元字典序</text>
    <text style="font-size: 8.3px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(275.702976 257.265981)">• 全批次重评估多轮协同迭代（MC-ITR）与桥接</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 8.6px; font-family: 'SimSun', serif; fill: #ffffff" transform="translate(112.167776 303.800725)">第</text>
