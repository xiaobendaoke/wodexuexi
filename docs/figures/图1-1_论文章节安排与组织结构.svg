   <g id="text_1">
    <text style="font-size: 9.5px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(230.124 26.675157)">第一章：绪论</text>
    <text style="font-size: 9.5px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(97.124 38.349767)">课题背景与研究意义  |  国内外研究现状综述  |  主要研究内容与章节组织</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(40.14368 86.505217)">系统建模</text>
    <text style="font-size: 9.5px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(40.14368 97.372326)">基础研究</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.2px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(157.87104 81.245639)">第二章</text>
    <text style="font-size: 9.2px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(130.27104 91.861576)">无人机集群空地协同</text>
    <text style="font-size: 9.2px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(130.27104 102.431514)">计算系统建模与分析</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(276.65136 81.426701)">• 自然覆盖几何关联、离散机动与无线信道建模</text>
    <text style="font-size: 9px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(265.40136 91.766858)">• 协议 I（批量等份共享）与协议 II（跨时隙排队）</text>
    <text style="font-size: 9px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(276.65136 102.152014)">• 截止期满足率双因子分解与同源配对评价准则</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(40.14368 216.282943)">协同规划</text>
    <text style="font-size: 9.5px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(44.89368 227.055052)">与控制</text>
    <text style="font-size: 9.5px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(40.14368 237.969662)">技术研究</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.2px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(157.87104 150.731319)">第三章</text>
    <text style="font-size: 9.2px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(130.27104 161.347256)">无人机集群需求感知</text>
    <text style="font-size: 9.2px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(144.07104 171.825194)">协同轨迹规划</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(281.15136 150.831225)">• 原始已关联观测下未覆盖需求混叠瓶颈诊断</text>
    <text style="font-size: 9px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(281.15136 161.171381)">• 感知半径内未覆盖终端按距离排序扩展观测</text>
    <text style="font-size: 9px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(272.15136 171.556538)">• 上层关系自注意力轨迹与下层无注意力精简卸载</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.2px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(157.87104 216.470279)">第四章</text>
    <text style="font-size: 9.2px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(121.07104 227.086216)">跨机资源竞争下的无人机</text>
    <text style="font-size: 9.2px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(134.87104 237.656154)">集群计算任务分配</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(276.65136 216.628841)">• 单时隙批量等份共享下的跨机迁移时延外部性</text>
    <text style="font-size: 9px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(276.65136 226.968998)">• 超时请求数优先与归一化时延次之二元字典序</text>
    <text style="font-size: 9px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(276.65136 237.399154)">• 全批次重评估多轮协同迭代（MC-ITR）与桥接</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(158.17104 282.463723)">第五章</text>
    <text style="font-size: 9px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(117.67104 292.803879)">动态排队服务中的规划蒸馏</text>
    <text style="font-size: 9px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(126.67104 303.099036)">与反事实辅助协同控制</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(274.40136 282.108645)">• 释放时间工作守恒 EDF 串联排队与等变双分支</text>
    <text style="font-size: 9px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(272.15136 292.763801)">• 两轮 DAgger 规划蒸馏与共同随机数反事实微调</text>
    <text style="font-size: 9px; font-family: 'SimSun', serif; fill: #22252a" transform="translate(272.15136 303.454114)">• 零前瞻快速推理与温度校准神经引导 Top-6 MPC</text>
   </g>
